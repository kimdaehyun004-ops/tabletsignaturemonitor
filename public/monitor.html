<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서명 실시간 모니터링</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login" class="login-box">
    <h2>모니터링 접속</h2>
    <input id="passwordInput" type="password" placeholder="관리자 비밀번호" />
    <button id="loginBtn">입장</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <div id="monitorPage" class="monitor-page board-mode" style="display:none;">
    <div class="monitor-header">
      <h1>서명 실시간 모니터링</h1>
      <span id="instanceBadge" class="instance-badge" style="display:none;"></span>
      <div class="status-legend" id="statusLegend"></div>
      <label class="mon-toggle"><input type="checkbox" id="toggleLabels" /> 글씨 표시</label>
      <label class="mon-toggle"><input type="checkbox" id="toggleBorders" /> 칸 구분선</label>
      <label class="mon-toggle"><input type="checkbox" id="toggleHideOffline" /> 미접속 숨기기</label>
      <label class="mon-toggle">가로 칸
        <select id="colsSelect"><option value="0">자동</option></select>
      </label>
      <button id="savedMgrBtn" class="admin-link" type="button">저장된 서명 관리</button>
      <a id="bgeditLink" href="bgedit.html" target="_blank" rel="noopener" class="admin-link" style="display:none;">배경 편집 ↗</a>
      <a href="admin.html" target="_blank" rel="noopener" class="admin-link">관리자 ↗</a>
      <span id="connStatus"></span>
    </div>
    <div class="board" id="grid"></div>
    <div class="qr-strip" id="qrStrip" style="display:none;"></div>
  </div>

  <div id="savedPanel" class="saved-panel" style="display:none;">
    <div class="saved-panel-inner">
      <div class="saved-panel-head">
        <h2>저장된 서명</h2>
        <button id="savedRefreshBtn" type="button">새로고침</button>
        <button id="savedDeleteAllBtn" class="danger" type="button">전체 삭제</button>
        <span class="bg-status" id="savedStatus"></span>
        <button id="savedCloseBtn" class="saved-close" type="button" aria-label="닫기">✕</button>
      </div>
      <div id="savedGrid" class="sig-grid"></div>
      <div id="savedEmpty" class="empty-hint" style="display:none;">아직 저장된 서명이 없습니다.</div>
    </div>
  </div>

  <script src="qrcode.lib.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
