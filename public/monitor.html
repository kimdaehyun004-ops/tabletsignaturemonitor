<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서명 실시간 모니터링</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login" class="login-box">
    <h2>모니터링 접속</h2>
    <input id="passwordInput" type="password" placeholder="관리자 비밀번호" />
    <button id="loginBtn">입장</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <div id="monitorPage" class="monitor-page board-mode" style="display:none;">
    <div class="monitor-header">
      <h1>서명 실시간 모니터링</h1>
      <span id="instanceBadge" class="instance-badge" style="display:none;"></span>
      <div class="status-legend" id="statusLegend"></div>
      <a href="admin.html" target="_blank" rel="noopener" class="admin-link">관리자 ↗</a>
      <span id="connStatus"></span>
    </div>
    <div class="board" id="grid"></div>
    <div class="qr-strip" id="qrStrip" style="display:none;"></div>
  </div>

  <script src="qrcode.lib.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
