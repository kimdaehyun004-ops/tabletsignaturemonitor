<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="manifest" href="manifest.json" />
<title>서명 - 태블릿</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="setup" class="setup-box" style="display:none;">
    <h2>태블릿 설정</h2>
    <p>이 태블릿의 번호와 접속 토큰을 입력하세요.</p>
    <select id="idSelect"></select>
    <input id="tokenInput" type="password" placeholder="접속 토큰" />
    <button id="startBtn">시작</button>
    <div class="setup-error" id="setupError"></div>
  </div>

  <div id="signPage" class="sign-page" style="display:none;">
    <div class="sign-topbar">
      <span><span id="statusDot" class="status-dot"></span><span id="statusText">연결 중...</span></span>
      <span id="tabletLabel"></span>
      <span class="topbar-btns">
        <button id="hideUiBtn" class="fullscreen-btn" title="화면 정리">▢ 화면 정리</button>
        <button id="fullscreenBtn" class="fullscreen-btn" title="전체화면">⛶ 전체화면</button>
      </span>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <img id="signBg" class="sign-bg" alt="" style="display:none;" />
      <canvas id="signCanvas"></canvas>
      <div class="sign-guide-line" id="signGuideLine"></div>
      <!-- 화면 정리(숨김) 모드에서 좌상단에만 남는 미니 연결 표시등. 더블 터치하면 UI 복원 -->
      <div id="miniStatus" class="mini-status" title="더블 터치하면 메뉴가 다시 나옵니다">
        <span id="miniDot" class="status-dot"></span><span id="miniText">연결됨</span>
      </div>
    </div>
    <div class="sign-actions">
      <button class="btn-clear" id="clearBtn">지우기</button>
      <button class="btn-save" id="saveBtn">서명 완료 저장</button>
    </div>
  </div>

  <div id="toast" class="toast">저장되었습니다</div>

  <script src="sign.js"></script>
</body>
</html>
