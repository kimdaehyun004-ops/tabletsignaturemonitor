<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>태블릿 연결 QR코드</title>
<link rel="stylesheet" href="style.css" />
<style>
  body { background: #f3f3f3; color: #111; }
  .links-page { max-width: 1000px; margin: 0 auto; padding: 24px; }
  .links-page h1 { font-size: 20px; }
  .links-page p.hint { color: #555; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 14px; text-align: center; }
  .card h3 { margin: 0 0 10px; }
  .card .qr { display: flex; justify-content: center; margin-bottom: 8px; }
  .card a { font-size: 12px; word-break: break-all; color: #2563eb; }
  .monitor-card { background: #eef2ff; border-color: #c7d2fe; }
</style>
</head>
<body>
  <div class="links-page">
    <h1>태블릿 연결 QR코드</h1>
    <p class="hint" id="hintText">각 태블릿 카메라로 해당 번호의 QR코드를 스캔하면 자동으로 서명 화면에 연결됩니다.</p>

    <div class="cards">
      <div class="card monitor-card">
        <h3>PC 모니터링 화면</h3>
        <div class="qr" id="monitorQr"></div>
        <a id="monitorLink" href="#"></a>
      </div>
    </div>

    <h1 style="margin-top:28px;">태블릿별 QR코드</h1>
    <div class="cards" id="tabletCards"></div>
  </div>

  <script src="qrcode.lib.js"></script>
  <script src="links.js"></script>
</body>
</html>
